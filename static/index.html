<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desktop">
<meta name="theme-color" content="#000000">
<title>Desktop</title>
<style>
  :root {
    color-scheme: dark; --bar: #161920; --fg: #e6e6ea; --muted: #8b8b94; --button: #232833; --border: #2c313b;
    --primary: oklch(0.623 0.214 259.815); --keys: #0f1115; --key: #474c57; --key-special: #2a2e37; --key-down: #6a7180;
    --row: 44px; --strip-row: 36px; --gap: 6px; --key-font: 21px; --word-font: 15px; --bar-button: 32px;
  }
  /* A phone on its side has little height: shorter keys and bar. */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --row: 29px; --strip-row: 25px; --gap: 4px; --key-font: 16px; --word-font: 13px; --bar-button: 27px; }
  }
  html { height: 100%; background: #000; touch-action: manipulation; }
  body {
    position: fixed; top: 0; left: 0; right: 0; height: 100%; margin: 0;
    display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
    background: #000; color: var(--fg); font: 14px/1.4 system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative; flex: 1; min-height: 0;
    margin: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #bottom { flex: none; padding-bottom: env(safe-area-inset-bottom); background: var(--keys); border-top: 1px solid var(--border); }
  /* The phone's own keyboard covers the bottom: no gap for the home bar. */
  body.phone #bottom { padding-bottom: 0; }
  #bar {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; background: var(--bar);
    padding: 4px calc(env(safe-area-inset-right) + 8px) 4px calc(env(safe-area-inset-left) + 8px);
  }
  #bar::-webkit-scrollbar { display: none; }
  #bar button, #bar select {
    flex: none; height: var(--bar-button); padding: 0 11px; font: inherit; font-weight: 500; color: var(--fg);
    background: var(--button); border: 1px solid var(--border); border-radius: 8px; touch-action: manipulation;
  }
  #bar button.on { color: #fff; background: var(--primary); border-color: transparent; }
  #strip, #keys {
    display: none; flex-direction: column; gap: var(--gap); touch-action: none;
    padding: var(--gap) calc(env(safe-area-inset-right) + 4px) 0 calc(env(safe-area-inset-left) + 4px);
  }
  #keys { padding-bottom: var(--gap); }
  body.phone #strip { padding-bottom: var(--gap); }
  body.keyboard #strip, body.phone #strip, body.keyboard #keys { display: flex; }
  .page { display: none; flex-direction: column; gap: var(--gap); }
  .page.shown { display: flex; }
  .row { display: flex; gap: var(--gap); height: var(--row); }
  #strip .row { height: var(--strip-row); gap: 4px; }
  .gap { flex: 1 1 0; }
  .key {
    flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
    white-space: nowrap; font-size: var(--key-font); color: #fff; background: var(--key);
    border-radius: 6px; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.7);
  }
  .key.special { font-size: var(--word-font); background: var(--key-special); }
  #strip .key { font-size: var(--word-font); background: var(--key-special); }
  .key[data-value="Space"] { font-size: var(--word-font); }
  /* The strip's Shift only for the phone's own keyboard: ours has its own. */
  #strip .key[data-value="ShiftLeft"] { display: none; }
  body.phone #strip .key[data-value="ShiftLeft"] { display: flex; }
  .key.down { background: var(--key-down); }
  .key.on { background: var(--primary); color: #fff; }
  /* Tapped twice: stays on until tapped again. */
  .key.locked { background: var(--primary); color: #fff; box-shadow: inset 0 -3px 0 rgba(255, 255, 255, 0.85); }
  /* A phone on its side: the keyboard is a panel at the side, over the screen. */
  #grip { display: none; }
  body.side #panel {
    position: absolute; top: 0; bottom: 0; right: 0; z-index: 3; display: flex; max-width: calc(100% - 40px);
    background: rgba(15, 17, 21, 0.94); border-left: 1px solid var(--border);
    animation: from-right 0.2s ease-out; transition: transform 0.2s ease-out;
  }
  body.side #panel.left { right: auto; left: 0; border-left: 0; border-right: 1px solid var(--border); animation-name: from-left; }
  body.side #panel.tucked { transform: translateX(calc(100% - 24px)); }
  body.side #panel.left.tucked { transform: translateX(calc(-100% + 24px)); }
  @keyframes from-right { from { transform: translateX(100%); } }
  @keyframes from-left { from { transform: translateX(-100%); } }
  body.side #grip {
    flex: none; width: 24px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 4px 0 8px; touch-action: none;
  }
  body.side #panel.left #grip { order: 2; }
  .pill { width: 5px; height: 44px; border-radius: 3px; background: #6a7180; }
  #swap {
    width: 24px; height: 30px; padding: 0; font: inherit; font-size: 16px; color: var(--muted);
    background: none; border: 0; touch-action: none;
  }
  body.side #panel-keys {
    flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; padding: 6px 6px 6px 0;
  }
  body.side #panel.left #panel-keys { padding: 6px 0 6px 6px; }
  body.side #strip, body.side #keys { padding: 0; gap: 5px; }
  body.side .page { gap: 5px; }
  body.side .row { height: 50px; gap: 5px; }
  body.side #strip .row { height: 38px; }
  body.side .key { font-size: 19px; }
  body.side .key.special, body.side #strip .key, body.side .key[data-value="Space"] { font-size: 13px; }
  #show {
    position: absolute; z-index: 2; display: none; height: 32px; padding: 0 11px;
    bottom: calc(env(safe-area-inset-bottom) + 8px); right: calc(env(safe-area-inset-right) + 8px);
    font: inherit; color: var(--fg); background: rgba(35, 40, 51, 0.75); border: 1px solid var(--border); border-radius: 8px;
  }
  body.side:not(.panel-left) #show { right: auto; left: calc(env(safe-area-inset-left) + 8px); }
  #status {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; color: var(--muted); pointer-events: none;
  }
  #status button {
    pointer-events: auto; padding: 10px 18px; font: inherit; font-weight: 600; color: #fff;
    background: var(--primary); border: 0; border-radius: 8px;
  }
  /* Where the phone's own keyboard types. Hidden, and 16px so Safari doesn't zoom in when it gets focus. */
  #typing {
    position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding: 0; border: 0;
    opacity: 0; font-size: 16px; resize: none; color: transparent; background: transparent; caret-color: transparent;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen"></canvas>
  <div id="status"><span id="status-text">Connecting…</span><button id="reconnect" hidden>Reconnect</button></div>
</div>
<div id="bottom">
  <div id="bar">
    <button id="keyboard-button">Keyboard</button>
    <button id="phone-button">Phone keyboard</button>
    <button id="mode">Trackpad</button>
    <button id="fit">Fit</button>
    <select id="quality" aria-label="Quality">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <button id="terminal-button">Terminal</button>
    <button id="hide">Hide</button>
    <button id="sign-out">Sign out</button>
  </div>
  <div id="panel">
    <div id="grip"><button id="swap" aria-label="Other side">⇄</button><span class="pill"></span><span></span></div>
    <div id="panel-keys">
      <div id="strip"></div>
      <div id="keys"></div>
    </div>
  </div>
</div>
<button id="show">Show</button>
<textarea id="typing" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type on the computer"></textarea>
<script src="/desktop/viewer.js"></script>
</body>
</html>
